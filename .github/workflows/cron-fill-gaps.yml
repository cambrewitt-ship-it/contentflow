name: Fill Calendar Gaps

on:
  schedule:
    - cron: '43 17 * * *'  # Daily 17:43 UTC = early morning in NZ
  workflow_dispatch:       # Allow manual trigger

jobs:
  fill-gaps:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Draft posts for gaps in the next 7 days
        run: |
          curl -f -X GET "${{ secrets.APP_URL }}/api/cron/fill-gaps" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}"
